# Netlify 部署配置（连 Git 自动部署时生效）
[build]
  publish = "."
  command = "npm install"

[functions]
  directory = "netlify/functions"

# 数据桶缓存 1 小时，根文件不缓存（更新后即时生效）
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/health"
  to = "/health.json"
  status = 200
